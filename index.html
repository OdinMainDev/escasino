<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.effective-solution.com/sc/lib/eschat.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>White casino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" defer>
      document
        .getElementById('essupport')
        .setAttribute('data-api-token', import.meta.env.VITE_APP_CHAT_API_TOKEN);
        
      document
        .getElementById('essupport')
        .setAttribute('data-language', import.meta.env.VITE_DEFAULT_LANGUAGE);
    </script>
    <div id="essupport" data-api-token="" data-user-token="" data-language=""></div>
    <script defer>
      function getCookie(name) {
        let value = '; ' + document.cookie;
        let parts = value.split('; ' + name + '=');
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      function setUserToken() {
        const userToken = getCookie('atoken');
        const casinoToken = getCookie('cainoToken');
        const supportDiv = document.getElementById('essupport');

        if (supportDiv && userToken) {
          supportDiv.setAttribute('data-user-token', userToken);
        }
      }

      setUserToken();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.effective-solution.com/sc/lib/eschat.js" defer></script>
  </body>
</html>
